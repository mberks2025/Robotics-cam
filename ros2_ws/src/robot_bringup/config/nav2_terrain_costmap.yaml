# nav2_terrain_costmap.yaml: costmap settings that bring the terrain node's map into Nav2.
# Merge these blocks into your Nav2 params file (the full Nav2 setup comes in Phase 4, docs/ROADMAP.md).
#
# The terrain node publishes /terrain/grid (nav_msgs/OccupancyGrid, -1 unknown, 0 free, 100 hazard)
# in `odom`, rolling with the robot, when odometry TF is running. Nav2's stock StaticLayer can
# subscribe to any OccupancyGrid topic and, in a rolling costmap, transforms it into the costmap
# frame, so no custom C++ layer is needed for a first test. Holes and unseen crater floors arrive
# as lethal cells, which the stock obstacle layer cannot represent.
#
# If StaticLayer turns out too slow at 5 Hz updates, the fallback is the custom costmap layer
# described in the navigation plan.

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05                 # same as the terrain grid
      update_frequency: 5.0
      publish_frequency: 2.0
      track_unknown_space: true        # keep -1 cells as unknown, not free
      trinary_costmap: true
      lethal_cost_threshold: 100
      use_maximum: true                # combine layers by max, so terrain never lowers another layer's cost
      plugins: ["terrain_layer", "inflation_layer"]
      terrain_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /terrain/grid
        map_subscribe_transient_local: false   # the terrain node publishes volatile, not latched
        subscribe_to_updates: false
        transform_tolerance: 0.3
        footprint_clearing_enabled: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35         # set to the rover's half-width plus a margin
        cost_scaling_factor: 4.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map                # map -> odom comes from AprilTags (Phase 2)
      robot_base_frame: base_link
      rolling_window: false
      resolution: 0.05
      track_unknown_space: true
      use_maximum: true
      plugins: ["terrain_layer", "inflation_layer"]   # add the arena static map layer in Phase 4
      terrain_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /terrain/grid
        map_subscribe_transient_local: false
        subscribe_to_updates: false
        transform_tolerance: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
