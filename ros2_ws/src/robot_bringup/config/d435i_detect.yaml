# d435i_detect.yaml: YOLO with distances. Same as d435i_orin.yaml plus
# depth aligned to color (/camera/camera/aligned_depth_to_color/image_raw).
initial_reset: true

enable_color: true
rgb_camera.color_profile: 640x480x15
rgb_camera.color_format: RGB8

enable_depth: true
depth_module.depth_profile: 640x480x30
enable_infra1: true
enable_infra2: true
depth_module.infra_profile: 640x480x30
depth_module.emitter_enabled: 1      # on: better depth on plain surfaces for distance estimates

enable_gyro: true
enable_accel: true
gyro_fps: 200
accel_fps: 250
unite_imu_method: 2

align_depth.enable: true             # costs CPU (or GPU with the CUDA librealsense build)
pointcloud.enable: false
enable_sync: false
