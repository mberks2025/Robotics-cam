# d435i_terrain.yaml: depth for the terrain / height map. Emitter on (regolith and
# sand have little texture), decimation halves depth resolution, plenty for a 5 cm grid.
initial_reset: true

enable_color: false
enable_depth: true
depth_module.depth_profile: 640x480x30
enable_infra1: false
enable_infra2: false
depth_module.emitter_enabled: 1

enable_gyro: true                    # IMU gravity vector gives "up" for the ground reference
enable_accel: true
gyro_fps: 200
accel_fps: 250
unite_imu_method: 2

decimation_filter.enable: true
spatial_filter.enable: true
temporal_filter.enable: true
align_depth.enable: false
pointcloud.enable: false
enable_sync: false
